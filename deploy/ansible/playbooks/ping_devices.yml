---
- name: Ping devices and collect latency
  hosts: all
  gather_facts: no
  tasks:
    - name: Run ping command on device
      ansible.netcommon.cli_command:
        command: ping 127.0.0.1 -c 3
      register: ping_result
      ignore_errors: yes

    - name: Show ping output
      ansible.builtin.debug:
        msg: "{{ ping_result.stdout_lines | default('unreachable') }}"
