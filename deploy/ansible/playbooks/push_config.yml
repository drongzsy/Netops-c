- name: Push configuration to device
  hosts: all
  gather_facts: no
  tasks:
    - name: Apply config commands
      ansible.netcommon.cli_config:
        config: "{{ config_lines | join('\n') }}"
      register: push_result
      timeout: 120

    - name: Save configuration
      ansible.netcommon.cli_command:
        command: save
      timeout: 30
